packages:
  - apps/*
  - packages/*

# React Native / Metro resolves most reliably from a flat node_modules (see docs/decisions.md).
nodeLinker: hoisted

# Dependencies allowed to run install scripts (pnpm blocks them by default).
allowBuilds:
  supabase: true
  # From the Next.js template: these ship prebuilt binaries, no install script needed.
  sharp: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.28'
  - '@expo/config-plugins@57.0.10'
  - '@expo/config@57.0.10'
  - '@expo/image-utils@0.11.6'
  - '@expo/metro-config@57.0.13'
  - '@expo/metro-file-map@57.0.4'
  - '@expo/prebuild-config@57.0.17'
  - '@expo/require-utils@57.0.6'
  - '@expo/router-server@57.0.12'
  - '@expo/ui@57.0.22'
  - '@supabase/cli-darwin-arm64@2.120.0'
  - '@supabase/cli-darwin-x64@2.120.0'
  - '@supabase/cli-linux-arm64-musl@2.120.0'
  - '@supabase/cli-linux-arm64@2.120.0'
  - '@supabase/cli-linux-x64-musl@2.120.0'
  - '@supabase/cli-linux-x64@2.120.0'
  - '@supabase/cli-windows-arm64@2.120.0'
  - '@supabase/cli-windows-x64@2.120.0'
  - babel-preset-expo@57.0.14
  - expo-asset@57.0.19
  - expo-constants@57.0.21
  - expo-linking@57.0.12
  - expo-modules-autolinking@57.0.14
  - expo-modules-core@57.0.21
  - expo-router@57.0.25
  - expo@57.0.27
  - supabase@2.120.0
