<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="vivodha">
  <!--
    Android adaptive-icon foreground layer: leaves + seed only, transparent
    background, scaled down and centered so the artwork sits inside the
    system's ~66% safe zone (the background rounded square is a separate
    solid-colour layer: android-icon-background.png).
  -->
  <g transform="translate(50 50) scale(0.62) translate(-50 -50)">
    <path d="M50 78 C 20 65 15 35 28 15 C 34 34 38 56 50 78 Z" fill="#FFFFFF" />
    <path d="M50 78 C 80 65 85 35 72 15 C 66 34 62 56 50 78 Z" fill="#FFFFFF" fill-opacity="0.88" />
    <circle cx="50" cy="12" r="6.5" fill="#FF9F1C" />
  </g>
</svg>
