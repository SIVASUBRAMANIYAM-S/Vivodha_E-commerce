<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="vivodha">
  <!--
    Vivodha brand mark (ADR-123): rounded-square emerald background, a white
    "V" built from two overlapping leaf shapes, and a saffron seed dot above.
    Single source of truth — apps/admin and apps/mobile both regenerate their
    platform assets from this file. Colors are the literal brand hex values
    (not CSS vars), since this file is rasterized as a static image asset.
  -->
  <rect width="100" height="100" rx="24" fill="#0B7A55" />
  <path d="M50 78 C 20 65 15 35 28 15 C 34 34 38 56 50 78 Z" fill="#FFFFFF" />
  <path d="M50 78 C 80 65 85 35 72 15 C 66 34 62 56 50 78 Z" fill="#FFFFFF" fill-opacity="0.88" />
  <circle cx="50" cy="12" r="6.5" fill="#FF9F1C" />
</svg>
